# Build frontend/ ด้วย Vite แล้ว publish ลงแบรนช์ gh-pages
# GitHub Pages ตั้งค่าเป็น "Deploy from a branch: gh-pages / (root)"
# URL: https://jariya-aum.github.io/Demo_SLA/
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# ปล่อยให้ deploy ที่กำลังทำงานอยู่จบก่อน ไม่ยกเลิกกลางคัน
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Pages เสิร์ฟ project site ใต้ /Demo_SLA/ จึงต้องตั้ง base ให้ตรง
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # gh-pages เก็บเฉพาะผลลัพธ์ build จึง force push ทับทุกครั้ง
      # ไม่ต้องเก็บประวัติ ประวัติจริงอยู่ที่ main
      - name: Publish dist/ to gh-pages
        working-directory: frontend/dist
        run: |
          git init -b gh-pages
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Deploy ${GITHUB_SHA} to GitHub Pages"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
