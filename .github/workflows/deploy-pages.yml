# Publish webapp/ (Web Map App แสดงผลการศึกษา SLA) ลงแบรนช์ gh-pages
#
# webapp/ เป็น static site ล้วน ๆ — ไม่มี build step, ไม่มี dependency ที่ต้องติดตั้ง
# จึงคัดลอกไฟล์ขึ้น gh-pages ได้ตรง ๆ
#
# GitHub Pages ตั้งค่าเป็น "Deploy from a branch: gh-pages / (root)"
# URL: https://jariya-aum.github.io/Demo_SLA/
name: Deploy web map app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'webapp/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# ปล่อยให้ deploy ที่กำลังทำงานอยู่จบก่อน ไม่ยกเลิกกลางคัน
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ทุก path ในเว็บเป็น relative ทั้งหมด จึงย้ายไปวางที่ root ของ gh-pages ได้เลย
      # .nojekyll กัน Jekyll ทิ้งไฟล์/โฟลเดอร์ที่ขึ้นต้นด้วย _ (และทำให้ deploy เร็วขึ้น)
      - name: ตรวจว่าไฟล์ข้อมูลครบก่อน deploy
        run: |
          set -e
          for f in index.html .nojekyll \
                   css/style.css \
                   js/data.js js/charts.js js/map.js js/report.js js/app.js \
                   data/meta.json data/stations.geojson \
                   data/sla_historical.csv data/meteorology.csv \
                   data/model_predictions.csv data/model_metrics.csv \
                   data/model_settings.csv data/rf_feature_importance.csv \
                   data/monthly_climatology.csv data/forecast.csv; do
            test -f "webapp/$f" || { echo "ไม่พบ webapp/$f"; exit 1; }
          done

      # gh-pages เก็บเฉพาะไฟล์ที่ deploy จึง force push ทับทุกครั้ง
      # ประวัติจริงอยู่ที่ main
      - name: Publish webapp/ to gh-pages
        working-directory: webapp
        run: |
          git init -b gh-pages
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Deploy ${GITHUB_SHA} to GitHub Pages"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
