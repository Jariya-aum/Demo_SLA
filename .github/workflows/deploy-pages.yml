# Build frontend/ ด้วย Vite แล้ว deploy ขึ้น GitHub Pages
# URL ที่ได้: https://jariya-aum.github.io/Demo_SLA/
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ปล่อยให้ deploy ที่กำลังทำงานอยู่จบก่อน ไม่ยกเลิกกลางคัน
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # enablement: true เปิด GitHub Pages ให้อัตโนมัติถ้ายังไม่เคยเปิด
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # Pages เสิร์ฟ project site ใต้ /Demo_SLA/ จึงต้องตั้ง base ให้ตรง
      - run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
